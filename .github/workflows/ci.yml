name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `tempomem` is not on PyPI yet; install the core from its public repo.
      # `worldsense` ([perception] extra) is private and not needed by
      # the shipped tests, so it is omitted here.
      - run: pip install numpy pytest "tempomem @ git+https://github.com/wikieden/tempomem.git@feat/cosmos-integration"
      - run: PYTHONPATH=src pytest tests -q
